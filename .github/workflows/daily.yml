name: Daily Video Factory

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video to render (defaults to the first V2 test video)"
        required: false
        type: string
        default: "brain-tired-001"

permissions:
  contents: write

concurrency:
  group: daily-video-factory
  cancel-in-progress: false

jobs:
  build:
    name: Build one Persian short video
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate or install FFmpeg and FFprobe
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "System FFmpeg and FFprobe are already available."
          else
            echo "Trying a bounded apt install without an unnecessary apt-get update..."
            if ! timeout --signal=TERM --kill-after=5s 75s sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              install -y ffmpeg; then
              echo "Direct apt install failed; refreshing package metadata once."
              if timeout --signal=TERM --kill-after=5s 75s sudo apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update; then
                timeout --signal=TERM --kill-after=5s 75s sudo apt-get \
                  -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  install -y ffmpeg || true
              else
                echo "apt-get update did not finish within its time budget."
              fi
            fi
          fi

          fallback_dir="$RUNNER_TEMP/remotion-media-bin"
          mkdir -p "$fallback_dir"

          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "System ffmpeg is unavailable; adding the Remotion FFmpeg fallback."
            cat > "$fallback_dir/ffmpeg" <<'WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          exec npx --no-install remotion ffmpeg "$@"
          WRAPPER
            chmod +x "$fallback_dir/ffmpeg"
            echo "REMOTION_FFMPEG_FALLBACK=1" >> "$GITHUB_ENV"
          fi

          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "System ffprobe is unavailable; adding the Remotion FFprobe fallback."
            cat > "$fallback_dir/ffprobe" <<'WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          exec npx --no-install remotion ffprobe "$@"
          WRAPPER
            chmod +x "$fallback_dir/ffprobe"
          fi

          if [[ -x "$fallback_dir/ffmpeg" || -x "$fallback_dir/ffprobe" ]]; then
            echo "$fallback_dir" >> "$GITHUB_PATH"
            echo "Remotion bundled media binary fallback registered for following steps."
          else
            echo "System media binaries are available."
          fi

      - name: Install Node packages
        timeout-minutes: 5
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verify FFmpeg and FFprobe capabilities
        timeout-minutes: 2
        shell: bash
        run: |
          set -Eeuo pipefail
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

          if [[ "${REMOTION_FFMPEG_FALLBACK:-0}" == "1" ]]; then
            echo "Checking the required subset of Remotion's bundled FFmpeg features..."
            filters="$(ffmpeg -hide_banner -filters 2>&1)"
            for required_filter in loudnorm amix atrim apad adelay volume asetpts scale; do
              if ! grep -Eq "[[:space:]]${required_filter}[[:space:]]" <<< "$filters"; then
                echo "Bundled Remotion FFmpeg is missing required filter: ${required_filter}" >&2
                exit 1
              fi
            done

            encoders="$(ffmpeg -hide_banner -encoders 2>&1)"
            for required_encoder in libmp3lame png pcm_s16le; do
              if ! grep -q "$required_encoder" <<< "$encoders"; then
                echo "Bundled Remotion FFmpeg is missing required encoder: ${required_encoder}" >&2
                exit 1
              fi
            done

            muxers="$(ffmpeg -hide_banner -muxers 2>&1)"
            for required_muxer in mp3 wav null image2; do
              if ! grep -Eq "[[:space:]]${required_muxer}[[:space:]]" <<< "$muxers"; then
                echo "Bundled Remotion FFmpeg is missing required muxer: ${required_muxer}" >&2
                exit 1
              fi
            done

            echo "Remotion FFmpeg fallback passed filter, encoder and muxer capability checks."
          fi

      - name: Install Python packages
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build video
        id: pipeline
        timeout-minutes: 15
        env:
          VIDEO_ID: ${{ inputs.video_id || 'brain-tired-001' }}
        run: node scripts/pipeline.mjs

      - name: Upload loop diagnostics if the build fails
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: loop-diagnostics-${{ github.run_id }}
          path: |
            out/brain-tired-001-contact-sheet.png
            out/contact-sheet-frames/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Upload video, caption and contact sheet to GitHub Release
        if: steps.pipeline.outputs.has_video == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.pipeline.outputs.video_id }}
          VIDEO_PATH: ${{ steps.pipeline.outputs.video_path }}
          CAPTION_PATH: ${{ steps.pipeline.outputs.caption_path }}
          CONTACT_SHEET_PATH: ${{ steps.pipeline.outputs.contact_sheet_path }}
        run: |
          set -euo pipefail
          TAG="video-${VIDEO_ID}"
          echo "Uploading ${VIDEO_ID}..."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VIDEO_PATH" "$CAPTION_PATH" "$CONTACT_SHEET_PATH" --clobber
          else
            gh release create "$TAG" "$VIDEO_PATH" "$CAPTION_PATH" "$CONTACT_SHEET_PATH" \
              --title "ذهن‌خوان - ${VIDEO_ID}" \
              --notes "Generated by the Persian video factory."
          fi

      - name: Upload voice comparison samples
        if: steps.pipeline.outputs.has_voice_samples == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.pipeline.outputs.video_id }}
          FARID_PATH: ${{ steps.pipeline.outputs.voice_sample_farid_path }}
          DILARA_PATH: ${{ steps.pipeline.outputs.voice_sample_dilara_path }}
        run: |
          set -euo pipefail
          TAG="video-${VIDEO_ID}"
          gh release upload "$TAG" "$FARID_PATH" "$DILARA_PATH" --clobber

      - name: Mark video as done
        if: steps.pipeline.outputs.has_video == 'true'
        timeout-minutes: 2
        env:
          VIDEO_ID: ${{ steps.pipeline.outputs.video_id }}
        run: node scripts/mark-done.mjs

      - name: Commit completed video status
        if: steps.pipeline.outputs.has_video == 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_bank.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Mark generated video as done"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: No pending video
        if: steps.pipeline.outputs.has_video != 'true'
        timeout-minutes: 1
        run: echo "Factory is idle. No pending videos."
