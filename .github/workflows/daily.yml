name: Daily Video Factory

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-video-factory
  cancel-in-progress: false

jobs:
  build:
    name: Build one Persian short video
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node packages
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build video
        id: pipeline
        run: node scripts/pipeline.mjs

      - name: Upload video to GitHub Release
        if: steps.pipeline.outputs.has_video == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.pipeline.outputs.video_id }}
          VIDEO_PATH: ${{ steps.pipeline.outputs.video_path }}
          CAPTION_PATH: ${{ steps.pipeline.outputs.caption_path }}
        run: |
          set -euo pipefail

          TAG="video-${VIDEO_ID}"

          echo "Uploading ${VIDEO_ID}..."

          # Reuse an existing release if a previous attempt
          # stopped after creating it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$VIDEO_PATH" \
              "$CAPTION_PATH" \
              --clobber
          else
            gh release create "$TAG" \
              "$VIDEO_PATH" \
              "$CAPTION_PATH" \
              --title "ذهن‌خوان - ${VIDEO_ID}" \
              --notes "Generated by the Persian video factory."
          fi

      - name: Mark video as done
        if: steps.pipeline.outputs.has_video == 'true'
        env:
          VIDEO_ID: ${{ steps.pipeline.outputs.video_id }}
        run: node scripts/mark-done.mjs

      - name: Commit completed video status
        if: steps.pipeline.outputs.has_video == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add content_bank.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Mark generated video as done"
            git push origin HEAD:main
          fi

      - name: No pending video
        if: steps.pipeline.outputs.has_video != 'true'
        run: echo "Factory is idle. No pending video."
