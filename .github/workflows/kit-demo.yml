name: Motion Kit Demo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-kit-demo
  cancel-in-progress: false

jobs:
  render-demo:
    name: Render and release Motion Kit demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg and FFprobe
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Install Node packages
        timeout-minutes: 6
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run regression and layout tests
        timeout-minutes: 2
        run: npm test

      - name: Install contact-sheet dependencies
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Render kit-demo composition
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          mkdir -p out
          npx remotion render src/index.jsx kit-demo out/kit-demo.mp4 --codec=h264 --crf=23 --pixel-format=yuv420p --concurrency=2

      - name: Create two-second contact sheet
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          python scripts/contact_sheet.py --video out/kit-demo.mp4 --output out/kit-demo-contact-sheet.png --every-seconds 2 --skip-loop-check
          test -s out/kit-demo.mp4
          test -s out/kit-demo-contact-sheet.png

      - name: Upload demo files to GitHub Release
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view kit-demo >/dev/null 2>&1; then
            gh release upload kit-demo out/kit-demo.mp4 out/kit-demo-contact-sheet.png --clobber
          else
            gh release create kit-demo out/kit-demo.mp4 out/kit-demo-contact-sheet.png \
              --title "ذهن‌خوان - Motion Kit V1 Demo" \
              --notes "Original Remotion components and layout animations. Generated on GitHub Actions."
          fi
